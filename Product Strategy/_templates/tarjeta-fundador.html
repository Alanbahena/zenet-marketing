  /* ── frente ── */
  .front{flex-direction:column;align-items:center;justify-content:center;gap:.11in;text-align:center}
  .front .logo{height:.36in;width:auto;display:block}
  .front .rule{width:.26in;height:1.5px;background:var(--ac);border-radius:2px}
  .front .slogan{font-family:var(--fd);font-weight:600;font-size:9.4pt;line-height:1.28;letter-spacing:-.006em;color:var(--ch);text-wrap:balance;max-width:2.6in}
  .front .slogan i{font-style:normal;color:var(--ac)}
  /* ── reverso ── */
  .back .name{font-family:var(--fd);font-weight:700;font-size:11.8pt;line-height:1.08;letter-spacing:-.016em}
  .back .role{font-family:var(--fd);font-weight:600;font-size:6.5pt;letter-spacing:.12em;text-transform:uppercase;color:var(--ac);margin-top:.05in}
  .back .rule{width:.26in;height:1.5px;background:var(--ac);border-radius:2px;margin:.1in 0}
  .back .lines{list-style:none;padding:0;display:flex;flex-direction:column;gap:.04in}
  .back .lines li{font-size:8.1pt;line-height:1.2;white-space:nowrap;color:var(--ch);font-weight:500}
  .back .lines li small{font-size:7pt;font-weight:400;color:var(--t7);margin-right:.05in}
  /* R3 · panel teal a la derecha, inset */
  .r3{flex-direction:row;align-items:stretch;justify-content:space-between;padding:.13in .13in .13in .21in;gap:.14in}
  .r3 .info{display:flex;flex-direction:column;justify-content:center}
  .r3 .panel{flex:none;width:1.08in;background:var(--ac);border-radius:.1in;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.07in}
  .r3 .chip{background:#fff;border-radius:.07in;padding:.06in;display:block;line-height:0}
  .r3 .qr{width:.76in;height:.76in;display:block}
  .r3 .panel span{font-family:var(--fd);font-weight:600;font-size:6.8pt;color:var(--mint);letter-spacing:.01em}
  /* ── hoja 10-up (Avery 8371: 0.5in arriba · 0.75in izq · 2 × 5 sin separación) ── */
  .sheetpage{width:8.5in;height:11in;padding:.5in .75in;display:grid;grid-template-columns:3.5in 3.5in;grid-auto-rows:2in;page-break-after:always;break-after:page;background:#fff}
  .sheetpage .card{page-break-after:auto;break-after:auto}
  /* marcas de corte (?marks=1): en los márgenes, nunca sobre las tarjetas */
  .sheetpage{position:relative}
  .mark{position:absolute;background:#9AA5A0}
  .mark.v{width:.5pt;height:.32in}
  .mark.h{height:.5pt;width:.32in}
